<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">ABII benchmark summary</title>
  <desc id="desc">Summary of ABII results across four SMAC and four MPE settings under delayed Byzantine attacks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".1"/></filter>
  </defs>
  <rect width="1600" height="720" rx="34" fill="url(#bg)"/>
  <text x="800" y="58" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f172a">Robust Performance under Delayed Byzantine Attacks</text>
  <text x="800" y="92" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#475569">ABII achieves the strongest reported final performance across all evaluated SMAC and MPE settings</text>

  <g filter="url(#shadow)"><rect x="70" y="135" width="700" height="505" rx="28" fill="#fff" stroke="#dbeafe"/><rect x="70" y="135" width="700" height="72" rx="28" fill="#eff6ff"/><path d="M70 179h700v28H70z" fill="#eff6ff"/><text x="110" y="180" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#1e3a8a">SMAC · Win Rate</text><text x="730" y="180" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#1d4ed8">4 combat scenarios</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <g transform="translate(110 245)"><text x="0" y="17" font-size="16" font-weight="700" fill="#334155">4m vs 3m</text><rect x="150" y="0" width="460" height="24" rx="12" fill="#e2e8f0"/><rect x="150" y="0" width="454" height="24" rx="12" fill="url(#accent)"/><text x="620" y="18" font-size="14" fill="#1e3a8a">near 1.0</text></g>
      <g transform="translate(110 325)"><text x="0" y="17" font-size="16" font-weight="700" fill="#334155">5m vs 3m</text><rect x="150" y="0" width="460" height="24" rx="12" fill="#e2e8f0"/><rect x="150" y="0" width="450" height="24" rx="12" fill="url(#accent)"/><text x="620" y="18" font-size="14" fill="#1e3a8a">near 1.0</text></g>
      <g transform="translate(110 405)"><text x="0" y="17" font-size="16" font-weight="700" fill="#334155">7m vs 6m</text><rect x="150" y="0" width="460" height="24" rx="12" fill="#e2e8f0"/><rect x="150" y="0" width="423" height="24" rx="12" fill="url(#accent)"/><text x="620" y="18" font-size="14" fill="#1e3a8a">&gt; 0.9</text></g>
      <g transform="translate(110 485)"><text x="0" y="17" font-size="16" font-weight="700" fill="#334155">9m vs 8m</text><rect x="150" y="0" width="460" height="24" rx="12" fill="#e2e8f0"/><rect x="150" y="0" width="452" height="24" rx="12" fill="url(#accent)"/><text x="620" y="18" font-size="14" fill="#1e3a8a">near 1.0</text></g>
    </g>
    <rect x="110" y="560" width="620" height="48" rx="14" fill="#eff6ff"/><text x="420" y="590" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#1e40af">Higher and more stable final win rates than representative baselines</text>
  </g>

  <g filter="url(#shadow)"><rect x="830" y="135" width="700" height="505" rx="28" fill="#fff" stroke="#ede9fe"/><rect x="830" y="135" width="700" height="72" rx="28" fill="#f5f3ff"/><path d="M830 179h700v28H830z" fill="#f5f3ff"/><text x="870" y="180" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#5b21b6">MPE Simple Spread · Return</text><text x="1490" y="180" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#7c3aed">4 team sizes</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <g transform="translate(870 245)"><text x="0" y="17" font-size="16" font-weight="700" fill="#334155">3 agents</text><rect x="150" y="0" width="460" height="24" rx="12" fill="#e2e8f0"/><rect x="150" y="0" width="400" height="24" rx="12" fill="url(#accent)"/><text x="620" y="18" font-size="14" fill="#5b21b6">≈ −1160</text></g>
      <g transform="translate(870 325)"><text x="0" y="17" font-size="16" font-weight="700" fill="#334155">4 agents</text><rect x="150" y="0" width="460" height="24" rx="12" fill="#e2e8f0"/><rect x="150" y="0" width="390" height="24" rx="12" fill="url(#accent)"/><text x="620" y="18" font-size="14" fill="#5b21b6">≈ −2600</text></g>
      <g transform="translate(870 405)"><text x="0" y="17" font-size="16" font-weight="700" fill="#334155">5 agents</text><rect x="150" y="0" width="460" height="24" rx="12" fill="#e2e8f0"/><rect x="150" y="0" width="382" height="24" rx="12" fill="url(#accent)"/><text x="620" y="18" font-size="14" fill="#5b21b6">≈ −4400</text></g>
      <g transform="translate(870 485)"><text x="0" y="17" font-size="16" font-weight="700" fill="#334155">8 agents</text><rect x="150" y="0" width="460" height="24" rx="12" fill="#e2e8f0"/><rect x="150" y="0" width="374" height="24" rx="12" fill="url(#accent)"/><text x="620" y="18" font-size="14" fill="#5b21b6">≈ −6500</text></g>
    </g>
    <rect x="870" y="560" width="620" height="48" rx="14" fill="#f5f3ff"/><text x="1180" y="590" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#6d28d9">The advantage persists as team size and social-information channels grow</text>
  </g>

  <text x="800" y="685" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">Reported over five independent runs; see the paper for complete learning curves and confidence intervals.</text>
</svg>

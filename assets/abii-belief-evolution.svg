<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Posterior intention belief evolution</title>
  <desc id="desc">Posterior Byzantine probability progressively concentrates on Agent 4 while beliefs for benign agents approach zero.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#eff6ff"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0f172a" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1500" height="650" rx="34" fill="url(#bg)"/>
  <text x="750" y="58" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f172a">Posterior Belief Evolution</text>
  <text x="750" y="91" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#475569">A five-agent example in which Agent 4 is Byzantine</text>

  <g filter="url(#shadow)"><rect x="70" y="130" width="820" height="445" rx="26" fill="#fff" stroke="#dbeafe"/>
    <text x="110" y="177" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#1e3a8a">Posterior heatmap</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#475569">
      <text x="330" y="213" text-anchor="middle">t = 0</text><text x="440" y="213" text-anchor="middle">t = 12</text><text x="550" y="213" text-anchor="middle">t = 25</text><text x="660" y="213" text-anchor="middle">t = 37</text><text x="770" y="213" text-anchor="middle">t = 50</text>
      <text x="115" y="257">Agent 0</text><text x="115" y="317">Agent 1</text><text x="115" y="377">Agent 2</text><text x="115" y="437">Agent 3</text><text x="115" y="497" font-weight="800" fill="#b91c1c">Agent 4 · Byzantine</text>
    </g>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">
      <g><rect x="275" y="230" width="110" height="44" rx="8" fill="#bfdbfe"/><text x="330" y="258" fill="#1e3a8a">0.201</text><rect x="385" y="230" width="110" height="44" rx="8" fill="#dbeafe"/><text x="440" y="258" fill="#1e3a8a">0.105</text><rect x="495" y="230" width="110" height="44" rx="8" fill="#eff6ff"/><text x="550" y="258" fill="#1e3a8a">0.049</text><rect x="605" y="230" width="110" height="44" rx="8" fill="#f8fafc"/><text x="660" y="258" fill="#64748b">0.005</text><rect x="715" y="230" width="110" height="44" rx="8" fill="#f8fafc"/><text x="770" y="258" fill="#64748b">0.001</text></g>
      <g><rect x="275" y="290" width="110" height="44" rx="8" fill="#bfdbfe"/><text x="330" y="318" fill="#1e3a8a">0.198</text><rect x="385" y="290" width="110" height="44" rx="8" fill="#dbeafe"/><text x="440" y="318" fill="#1e3a8a">0.105</text><rect x="495" y="290" width="110" height="44" rx="8" fill="#eff6ff"/><text x="550" y="318" fill="#1e3a8a">0.036</text><rect x="605" y="290" width="110" height="44" rx="8" fill="#f8fafc"/><text x="660" y="318" fill="#64748b">0.005</text><rect x="715" y="290" width="110" height="44" rx="8" fill="#f8fafc"/><text x="770" y="318" fill="#64748b">0.001</text></g>
      <g><rect x="275" y="350" width="110" height="44" rx="8" fill="#bfdbfe"/><text x="330" y="378" fill="#1e3a8a">0.205</text><rect x="385" y="350" width="110" height="44" rx="8" fill="#dbeafe"/><text x="440" y="378" fill="#1e3a8a">0.098</text><rect x="495" y="350" width="110" height="44" rx="8" fill="#eff6ff"/><text x="550" y="378" fill="#1e3a8a">0.049</text><rect x="605" y="350" width="110" height="44" rx="8" fill="#f8fafc"/><text x="660" y="378" fill="#64748b">0.008</text><rect x="715" y="350" width="110" height="44" rx="8" fill="#f8fafc"/><text x="770" y="378" fill="#64748b">0.001</text></g>
      <g><rect x="275" y="410" width="110" height="44" rx="8" fill="#bfdbfe"/><text x="330" y="438" fill="#1e3a8a">0.196</text><rect x="385" y="410" width="110" height="44" rx="8" fill="#dbeafe"/><text x="440" y="438" fill="#1e3a8a">0.112</text><rect x="495" y="410" width="110" height="44" rx="8" fill="#eff6ff"/><text x="550" y="438" fill="#1e3a8a">0.036</text><rect x="605" y="410" width="110" height="44" rx="8" fill="#f8fafc"/><text x="660" y="438" fill="#64748b">0.005</text><rect x="715" y="410" width="110" height="44" rx="8" fill="#f8fafc"/><text x="770" y="438" fill="#64748b">0.001</text></g>
      <g><rect x="275" y="470" width="110" height="44" rx="8" fill="#bfdbfe"/><text x="330" y="498" fill="#1e3a8a">0.200</text><rect x="385" y="470" width="110" height="44" rx="8" fill="#60a5fa"/><text x="440" y="498" fill="#fff">0.580</text><rect x="495" y="470" width="110" height="44" rx="8" fill="#2563eb"/><text x="550" y="498" fill="#fff">0.830</text><rect x="605" y="470" width="110" height="44" rx="8" fill="#1d4ed8"/><text x="660" y="498" fill="#fff">0.977</text><rect x="715" y="470" width="110" height="44" rx="8" fill="#1e3a8a"/><text x="770" y="498" fill="#fff">0.996</text></g>
    </g>
    <rect x="275" y="535" width="550" height="12" rx="6" fill="url(#heat)"/><text x="275" y="565" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">low Byzantine probability</text><text x="825" y="565" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#1e3a8a">high Byzantine probability</text>
  </g>

  <g filter="url(#shadow)"><rect x="940" y="130" width="490" height="445" rx="26" fill="#fff" stroke="#ede9fe"/><text x="980" y="177" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#5b21b6">Separation over time</text>
    <line x1="995" y1="500" x2="1375" y2="500" stroke="#cbd5e1" stroke-width="2"/><line x1="995" y1="225" x2="995" y2="500" stroke="#cbd5e1" stroke-width="2"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b"><text x="985" y="504" text-anchor="end">0.0</text><text x="985" y="449" text-anchor="end">0.2</text><text x="985" y="394" text-anchor="end">0.4</text><text x="985" y="339" text-anchor="end">0.6</text><text x="985" y="284" text-anchor="end">0.8</text><text x="985" y="229" text-anchor="end">1.0</text><text x="995" y="523" text-anchor="middle">0</text><text x="1090" y="523" text-anchor="middle">12</text><text x="1185" y="523" text-anchor="middle">25</text><text x="1280" y="523" text-anchor="middle">37</text><text x="1375" y="523" text-anchor="middle">50</text></g>
    <polyline points="995,445 1090,340 1185,272 1280,231 1375,226" fill="none" stroke="#dc2626" stroke-width="5"/><g fill="#dc2626"><circle cx="995" cy="445" r="6"/><circle cx="1090" cy="340" r="6"/><circle cx="1185" cy="272" r="6"/><circle cx="1280" cy="231" r="6"/><circle cx="1375" cy="226" r="6"/></g>
    <polyline points="995,445 1090,471 1185,488 1280,498 1375,500" fill="none" stroke="#3b82f6" stroke-width="4"/><polyline points="995,446 1090,471 1185,490 1280,499 1375,500" fill="none" stroke="#14b8a6" stroke-width="3"/><polyline points="995,444 1090,473 1185,488 1280,498 1375,500" fill="none" stroke="#8b5cf6" stroke-width="3"/><polyline points="995,446 1090,469 1185,490 1280,499 1375,500" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13"><circle cx="1020" cy="552" r="6" fill="#dc2626"/><text x="1033" y="557" fill="#7f1d1d">Agent 4 · Byzantine</text><circle cx="1190" cy="552" r="6" fill="#3b82f6"/><text x="1203" y="557" fill="#334155">Agents 0–3 · benign</text></g>
  </g>

  <text x="750" y="615" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#475569">Once discriminative behavior appears, the posterior provides a teammate-specific signal for information filtering.</text>
</svg>

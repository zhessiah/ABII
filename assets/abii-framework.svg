<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">ABII framework</title>
  <desc id="desc">Four-stage ABII pipeline: Bayesian intention inference, belief-gated social perception, active evidence acquisition, and value-aligned robust coordination.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d97706"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#111827" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1600" height="620" rx="34" fill="url(#bg)"/>
  <text x="800" y="58" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f172a">Active Bayesian Intention Inference</text>
  <text x="800" y="92" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#475569">Posterior beliefs connect social perception, evidence seeking, and long-horizon coordination</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="320" height="390" rx="26" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="70" y="145" width="320" height="78" rx="26" fill="url(#blue)"/>
    <path d="M70 197h320v26H70z" fill="url(#blue)"/>
    <circle cx="112" cy="184" r="18" fill="#fff" fill-opacity=".18"/><text x="112" y="191" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">1</text>
    <text x="144" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" fill="#fff">Bayesian Intention</text><text x="144" y="203" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" fill="#fff">Inference</text>
    <text x="100" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Local interaction history</text>
    <rect x="100" y="278" width="260" height="48" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="230" y="308" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e40af">bᵢₜ = qψ(θ₋ᵢ | hᵢₜ)</text>
    <text x="100" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#475569">Continuous teammate-wise</text><text x="100" y="387" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#475569">Byzantine-risk posterior</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
      <text x="100" y="432" fill="#334155">Agent 1</text><rect x="180" y="417" width="150" height="16" rx="8" fill="#e2e8f0"/><rect x="180" y="417" width="18" height="16" rx="8" fill="#3b82f6"/><text x="340" y="431" fill="#1e40af">0.08</text>
      <text x="100" y="470" fill="#334155">Agent 2</text><rect x="180" y="455" width="150" height="16" rx="8" fill="#e2e8f0"/><rect x="180" y="455" width="56" height="16" rx="8" fill="#6366f1"/><text x="340" y="469" fill="#4338ca">0.37</text>
      <text x="100" y="508" fill="#334155">Agent N</text><rect x="180" y="493" width="150" height="16" rx="8" fill="#e2e8f0"/><rect x="180" y="493" width="107" height="16" rx="8" fill="#8b5cf6"/><text x="340" y="507" fill="#6d28d9">0.71</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="445" y="145" width="320" height="390" rx="26" fill="#fff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="445" y="145" width="320" height="78" rx="26" fill="url(#green)"/><path d="M445 197h320v26H445z" fill="url(#green)"/>
    <circle cx="487" cy="184" r="18" fill="#fff" fill-opacity=".18"/><text x="487" y="191" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">2</text>
    <text x="519" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" fill="#fff">Belief-Gated Social</text><text x="519" y="203" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" fill="#fff">Perception</text>
    <text x="475" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#065f46">Credibility-aware information flow</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">
      <circle cx="492" cy="315" r="12" fill="#60a5fa"/><circle cx="530" cy="315" r="12" fill="#f59e0b"/><circle cx="568" cy="315" r="12" fill="#f87171"/><text x="610" y="320">teammate observations</text>
      <path d="M492 360h197" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="490" y="345" width="44" height="30" rx="9" fill="#d1fae5"/><text x="512" y="365" text-anchor="middle" fill="#047857">.92</text>
      <rect x="555" y="345" width="44" height="30" rx="9" fill="#d1fae5"/><text x="577" y="365" text-anchor="middle" fill="#047857">.63</text>
      <rect x="620" y="345" width="44" height="30" rx="9" fill="#fee2e2"/><text x="642" y="365" text-anchor="middle" fill="#b91c1c">.15</text>
      <text x="475" y="414" font-weight="700" fill="#065f46">Belief-conditioned VAE</text>
      <rect x="475" y="434" width="260" height="63" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/><text x="605" y="461" text-anchor="middle" font-family="monospace" font-size="15" fill="#047857">zᵢₜ ~ qω(z | oᵢₜ, bᵢₜ)</text><text x="605" y="483" text-anchor="middle" font-size="13" fill="#475569">posterior-weighted latent abstraction</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="820" y="145" width="320" height="390" rx="26" fill="#fff" stroke="#fde68a" stroke-width="2"/>
    <rect x="820" y="145" width="320" height="78" rx="26" fill="url(#amber)"/><path d="M820 197h320v26H820z" fill="url(#amber)"/>
    <circle cx="862" cy="184" r="18" fill="#fff" fill-opacity=".18"/><text x="862" y="191" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">3</text>
    <text x="894" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" fill="#fff">Active Evidence</text><text x="894" y="203" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" fill="#fff">Acquisition</text>
    <text x="850" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#92400e">Posterior entropy reduction</text>
    <g stroke="#f59e0b" stroke-width="3" fill="none"><path d="M860 402 C905 320, 950 380, 995 292 S1080 250,1100 272"/></g>
    <line x1="860" y1="412" x2="1100" y2="412" stroke="#cbd5e1" stroke-width="2"/><line x1="860" y1="282" x2="860" y2="412" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="860" cy="402" r="7" fill="#f59e0b"/><circle cx="995" cy="292" r="7" fill="#f59e0b"/><circle cx="1100" cy="272" r="7" fill="#f59e0b"/>
    <text x="850" y="447" font-family="monospace" font-size="15" fill="#92400e">rᴬᴵᴱᴬₜ = H(bₜ) − H(bₜ₊₁)</text>
    <rect x="850" y="468" width="260" height="42" rx="12" fill="#fffbeb" stroke="#fde68a"/><text x="980" y="494" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#78350f">seek interactions that reveal intent</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1195" y="145" width="335" height="390" rx="26" fill="#fff" stroke="#ddd6fe" stroke-width="2"/>
    <rect x="1195" y="145" width="335" height="78" rx="26" fill="url(#violet)"/><path d="M1195 197h335v26h-335z" fill="url(#violet)"/>
    <circle cx="1237" cy="184" r="18" fill="#fff" fill-opacity=".18"/><text x="1237" y="191" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">4</text>
    <text x="1269" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" fill="#fff">Value-Aligned Robust</text><text x="1269" y="203" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" fill="#fff">Coordination</text>
    <text x="1225" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#5b21b6">Dual-critic optimization</text>
    <rect x="1225" y="286" width="275" height="70" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/><text x="1362" y="314" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d28d9">Primary critic</text><text x="1362" y="339" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">policy + evidence-seeking return</text>
    <rect x="1225" y="377" width="275" height="70" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/><text x="1362" y="405" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d28d9">Filtered-state critic</text><text x="1362" y="430" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">TD gradient directly trains the gate</text>
    <rect x="1262" y="470" width="200" height="42" rx="21" fill="#7c3aed"/><text x="1362" y="497" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">cooperative action</text>
  </g>

  <path d="M395 340h42" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><path d="M770 340h42" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><path d="M1145 340h42" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">ABII - Active Bayesian Intention Inference</title>
  <desc id="desc">A visual banner showing belief inference, social filtering, evidence acquisition, and robust coordination.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.48" stop-color="#172554"/>
      <stop offset="1" stop-color="#3b1d6b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="480" rx="34" fill="url(#bg)"/>
  <circle cx="1320" cy="65" r="210" fill="#7c3aed" opacity="0.14"/>
  <circle cx="1440" cy="400" r="250" fill="#0ea5e9" opacity="0.10"/>
  <circle cx="140" cy="430" r="180" fill="#10b981" opacity="0.08"/>

  <g opacity="0.8" stroke="#93c5fd" stroke-width="3">
    <line x1="1225" y1="100" x2="1325" y2="65"/>
    <line x1="1225" y1="100" x2="1270" y2="185"/>
    <line x1="1325" y1="65" x2="1410" y2="135"/>
    <line x1="1270" y1="185" x2="1410" y2="135"/>
    <line x1="1410" y1="135" x2="1495" y2="235"/>
    <line x1="1270" y1="185" x2="1355" y2="285"/>
    <line x1="1355" y1="285" x2="1495" y2="235"/>
  </g>
  <g fill="#bfdbfe" filter="url(#glow)">
    <circle cx="1225" cy="100" r="10"/><circle cx="1325" cy="65" r="12"/>
    <circle cx="1270" cy="185" r="11"/><circle cx="1410" cy="135" r="12"/>
    <circle cx="1495" cy="235" r="11"/><circle cx="1355" cy="285" r="12"/>
  </g>

  <text x="105" y="132" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="4">ABII</text>
  <rect x="105" y="158" width="720" height="7" rx="4" fill="url(#accent)"/>
  <text x="105" y="222" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="650">Active Bayesian Intention Inference</text>
  <text x="105" y="275" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27">Robust multiagent cooperation under deceptive Byzantine attacks</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600">
    <g transform="translate(105 330)">
      <rect width="260" height="70" rx="18" fill="#ffffff" opacity="0.09" stroke="#60a5fa"/>
      <circle cx="34" cy="35" r="11" fill="#60a5fa"/>
      <text x="57" y="43" fill="#e0f2fe">Intention beliefs</text>
    </g>
    <g transform="translate(385 330)">
      <rect width="260" height="70" rx="18" fill="#ffffff" opacity="0.09" stroke="#34d399"/>
      <circle cx="34" cy="35" r="11" fill="#34d399"/>
      <text x="57" y="43" fill="#dcfce7">Social filtering</text>
    </g>
    <g transform="translate(665 330)">
      <rect width="260" height="70" rx="18" fill="#ffffff" opacity="0.09" stroke="#fb923c"/>
      <circle cx="34" cy="35" r="11" fill="#fb923c"/>
      <text x="57" y="43" fill="#ffedd5">Evidence seeking</text>
    </g>
    <g transform="translate(945 330)">
      <rect width="300" height="70" rx="18" fill="#ffffff" opacity="0.09" stroke="#c084fc"/>
      <circle cx="34" cy="35" r="11" fill="#c084fc"/>
      <text x="57" y="43" fill="#f3e8ff">Value alignment</text>
    </g>
  </g>
</svg>

env: "gymma"

env_args:
  key: "mpe:SimpleAdversary-v0"
  time_limit: 25
  pretrained_wrapper: null
  continuous_actions: True
  num_good: 2
  num_adversaries: 1
  num_landmarks: 2
  obs_radius: 1.0
  obs_noise: 0.1
  reward_type: "global"
  adversary_reward: 1.0
  good_reward: 1.0
  collision_penalty: 0.1
  seed: 1

# 运行设置
runner: "episode"
batch_size_run: 1

# 测试设置
test_greedy: True
test_nepisode: 100
test_interval: 50000
log_interval: 50000
runner_log_interval: 10000
learner_log_interval: 10000
t_max: 2050000